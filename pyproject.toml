[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dbt-core"
version = "0.2.0"
description = "SQL 工具链运行时内核：dbt.result/v1 协议信封、方言归一、SQL 指纹、只读连库、AST 结构化、执行计划归一。不含任何 MCP 业务判断。"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Proprietary"}

dependencies = [
    "sqlglot>=25.0",
]

[project.optional-dependencies]
mcp = ["mcp>=1.0"]
mysql = ["pymysql>=1.1"]
postgres = ["psycopg[binary]>=3.1"]
oracle = ["oracledb>=2.0"]
all = ["mcp>=1.0", "pymysql>=1.1", "psycopg[binary]>=3.1", "oracledb>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed", "*.yaml", "*.yml", "*.json"]
